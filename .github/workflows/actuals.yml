name: FPL actuals

on:
  schedule:
    # Every six hours. The 01:15 run is the one that matters — it lands after
    # bonus points are confirmed on a Sunday or Monday night round.
    - cron: "15 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-actuals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build data/actuals.json and data/rivals.json
        env:
          FPL_ENTRY_ID: "301830"
          FPL_SEASON: "2027"
          FPL_LEAGUE_ID: "391690"
        run: node scripts/build-actuals.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/actuals.json data/rivals.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "feeds: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
