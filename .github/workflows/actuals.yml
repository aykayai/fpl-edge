name: FPL actuals

on:
  schedule:
    # Every six hours. The 01:15 run is the one that matters — it lands after
    # bonus points are confirmed on a Sunday or Monday night round.
    - cron: "15 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: "Rebuild every gameweek from scratch, ignoring the pick cache"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fpl-actuals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # Cutover (19 Oct 2026): only actuals.json is published, for the GitHub
      # Pages backup. The rivals feed (other managers' names and squads) is
      # built on the FPL Signals server only, so it goes to the runner's temp
      # dir here and is never committed.
      - name: Build data/actuals.json
        env:
          FPL_RIVALS_OUT: ${{ runner.temp }}/rivals.json
          FPL_ENTRY_ID: "301830"
          FPL_SEASON: "2027"
          FPL_LEAGUE_ID: "391690"
          FPL_REBUILD_ALL: ${{ inputs.rebuild_all && '1' || '0' }}
        run: node scripts/build-actuals.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/actuals.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "feeds: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
