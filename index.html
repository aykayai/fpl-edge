<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FPL Signals - Planner &amp; Assistant</title>
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0C0E12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FPL Signals">
<meta name="description" content="FPL Signals - Fantasy Premier League planner, projections and transfer assistant.">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
 /* FPL Signals - Look A (13 Oct 2026): the Fintel/Jeevs house style
    (neutral greys, 5% ring, radii 6/8/12, white primary controls); the app
    keeps its green figures and orange gameweek so the three apps stay
    distinguishable. Fixture difficulty, price arrows, kits and the pitch
    keep their own meaning-carrying colours and are deliberately not themed. */
 --ink:#0A0A0A;--ink2:#171717;--ink3:#262626;--line:#404040;--ring:rgba(255,255,255,.06);
 --mint:#2DDC87;--cyan:#5BE8C0;--amber:#FF8A3D;
 --cream:#EDEDED;--mute:#A3A3A3;--sky:#5BE8C0;--skyDeep:#12657F;--red:#FF5470;
 --d5:#5C0011;--d4:#E01E37;--d3:#F0A02A;--d2:#3FBF63;--d1:#7DFB9E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ink);color:var(--cream);font-family:'Geist',system-ui,sans-serif;font-size:14px}
/* Redesign wave 1 (19 Oct 2026): every page uses the full screen width.
   12 Nov 2026 (Andy): more room at the sides, like the official site: the
   gutter grows with the screen, about 60px on his 1536px laptop, at most
   64px, and 16px on a phone. */
:root{--gut:clamp(24px,4vw,64px)}
@media(max-width:520px){:root{--gut:16px}}
.wrap{max-width:none;margin:0;padding:0 var(--gut) 24px;width:100%}
.wrap>*{max-width:100%}
/* one sticky bar: logo, eight pages, GW switcher, deadline, live dot;
   Predicted, Bank and FT join it once the page scrolls (body.scrolled) */
.tb{position:sticky;top:0;z-index:60;background:rgba(10,10,10,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 border-bottom:1px solid rgba(255,255,255,.07);margin:0 calc(-1*var(--gut)) 22px;padding:0 var(--gut)}
/* the bar runs edge to edge: .wrap>* would cap it at the content width */
.wrap>.tb{max-width:none}
.tbin{height:62px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;font:600 16px 'Geist',sans-serif;color:#fff;text-decoration:none;flex:none}
.brand .bl svg{width:30px;height:30px;display:block}
.tn{display:flex;gap:2px;margin-right:auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.tn::-webkit-scrollbar{display:none}
.tn .navlink{font:500 14px 'Geist',sans-serif;color:#9A9A9A;padding:8px 13px;border-radius:999px;text-decoration:none;white-space:nowrap;border:0}
.tn .navlink:hover{color:var(--cream);background:rgba(255,255,255,.06)}
.tn .navlink.on{color:#0A0A0A;background:#EDEDED}
.tr{display:flex;align-items:center;gap:16px;flex:none}
.tbfig{display:none;gap:16px;font-size:13px;color:#9A9A9A}
.tbfig b{color:#EDEDED;font-family:'Geist Mono',monospace;font-weight:500;margin-left:4px}
.tbfig b.mint{color:var(--mint)}
body.scrolled .tbfig{display:flex}
.gwsw{display:inline-flex;align-items:center;background:#171717;border-radius:999px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.gwsw button{background:none;border:0;color:#9A9A9A;font-size:16px;padding:6px 10px;min-height:0;border-radius:999px}
.gwsw button:hover{color:var(--cream)}
.gwsw b{font:600 14px 'Geist',sans-serif;color:#FF9A3D;min-width:40px;text-align:center}
.dl{display:grid;grid-template-columns:auto auto;column-gap:6px;line-height:1.15;font-size:12px}
.dl b{font:600 13px 'Geist',sans-serif;color:#EDEDED}
.dlk{color:#7A7A7A;font-size:11px}.dl .dlk:first-child{grid-column:1/-1}.dlk.soon{color:var(--amber)}
.live{display:grid;place-items:center;width:22px;height:22px}
.live i{display:block;width:9px;height:9px;border-radius:50%;background:#3DDC97;box-shadow:0 0 0 4px rgba(61,220,151,.15)}
.live.wait i{background:var(--amber);box-shadow:0 0 0 4px rgba(255,138,61,.18)}
.live.live i{animation:sigpulse 1.6s ease-in-out infinite}
@media(max-width:1100px){.dl{display:none}body.scrolled .tbfig{display:none}}
@media(max-width:720px){.tbin{gap:12px}.brand .bw{display:none}.tn .navlink{padding:7px 10px;font-size:13px}}
@media(max-width:520px){.tb{margin-bottom:16px}.tbin{height:54px}.gwsw b{min-width:34px}.gwsw button{padding:5px 7px}}
/* Planner hero: team name + four figure cards */
.hero{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:end;margin-bottom:14px}
.hk{font-size:12px;color:#7A7A7A}
.hero h1{margin:4px 0 0;font:600 24px 'Geist',sans-serif;letter-spacing:-.02em}
.hm{font-size:12px;color:#7A7A7A;margin-top:4px}
@media(max-width:900px){.hero{grid-template-columns:1fr;gap:12px}}
.pagetabs{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.pagetabs h1{font:600 24px 'Geist',sans-serif;letter-spacing:-.01em}
.pagetabs .pseg a{display:inline-block;padding:6px 14px;font-size:13px;font-weight:600;color:var(--cream);text-decoration:none}
.pagetabs .pseg a+a{border-left:1px solid rgba(255,255,255,.12)}
.pagetabs .pseg a.on{background:#EDEDED;color:#0A0A0A}
.btnlink{display:inline-flex;align-items:center;padding:6px 12px;border-radius:8px;background:var(--ink2);box-shadow:inset 0 0 0 1px var(--line);color:var(--cream);font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap}
.btnlink:hover{background:var(--ink3)}
/* wave 2: This Week strip, pop-ups, Compare */
.week{margin-bottom:14px}.weekh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.weekh h2{font:600 15px 'Geist',sans-serif;letter-spacing:0}
.hz{display:inline-flex;background:#171717;border-radius:999px;padding:3px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.hz button{background:none;border:0;color:#9A9A9A;font:500 12.5px 'Geist',sans-serif;padding:5px 12px;border-radius:999px;min-height:0}
.hz button.on{background:#EDEDED;color:#0A0A0A}
/* compact This Week cards (12 Nov 2026): icon left, title / figure / line */
.wkrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.wk{display:grid;grid-template-columns:28px minmax(0,1fr) auto;column-gap:10px;align-items:center;text-align:left;background:#141414;border:0;border-radius:12px;box-shadow:inset 0 0 0 1px var(--ring);padding:10px 12px;cursor:pointer;color:var(--cream);font:inherit;min-width:0}
.wk:hover{box-shadow:inset 0 0 0 1px var(--line)}
.wk .wkh{display:contents}.wk .wkh .tile{grid-row:1/4;grid-column:1;width:28px;height:28px}
.wkt{grid-row:1;grid-column:2;font-size:12px;line-height:16px;color:#9A9A9A;font-weight:500}
.chev{grid-row:1/4;grid-column:3;color:#5A5A5A;display:flex}
.wkf{grid-row:2;grid-column:2;font:600 15px/20px 'Geist',sans-serif;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkf .arr{color:#5A5A5A;font-weight:400}.wkf .cx{font-family:'Geist Mono',monospace;color:#FFB020;font-size:14px;margin-left:4px}
.wkl{grid-row:3;grid-column:2;font-size:12px;line-height:16px;color:#9A9A9A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wkl b{font-weight:600}
@media(max-width:1100px){.wkrow{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* phones: one row you swipe sideways */
@media(max-width:620px){.wkrow{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:2px}
 .wkrow::-webkit-scrollbar{display:none}.wk{flex:0 0 74%;scroll-snap-align:start}}
/* phone: the page menu gets its own full-width row under the logo and GW */
@media(max-width:720px){.tbin{flex-wrap:wrap;height:auto;padding:8px 0 6px;row-gap:6px}.tn{order:3;width:100%;margin:0}.tr{margin-left:auto}}
.up{color:var(--mint)}.dn{color:var(--red)}
.modal{position:fixed;inset:0;z-index:150;background:rgba(4,6,9,.72);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
.mbox{background:#121212;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line),0 24px 80px rgba(0,0,0,.7);width:100%;max-width:760px}
.mbox.wide{max-width:min(1480px,100%)}
.mhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--ink3);position:sticky;top:-24px;background:#121212;z-index:2;border-radius:14px 14px 0 0;flex-wrap:wrap}
.mhead h2{font:600 18px 'Geist',sans-serif;letter-spacing:0;margin-right:auto}
.mx{background:none;border:0;color:var(--mute);padding:6px;display:flex;min-height:0}.mx:hover{color:var(--cream)}
.mbody{padding:16px 18px 18px}
.mbody .panel{margin-top:14px}
.mfoot{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.mfoot button{display:inline-flex;align-items:center;gap:6px}
.pseg.mseg{border-color:var(--ink3)}.pseg.mseg button{padding:6px 14px;font-size:12.5px}
.pseg.mseg button.on{background:#EDEDED;color:#0A0A0A}
.fcgrid.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1100px){.fcgrid.c5{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media(max-width:900px){.cgrid{grid-template-columns:1fr}}
.chd{font-size:13px;font-weight:600;margin-bottom:8px}.chd .mu{font-weight:400;font-size:12px}
.cpitch{background:linear-gradient(180deg,#14361f,#0f2a18);border-radius:12px;padding:14px 8px 0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.crow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cpl{position:relative;display:flex;flex-direction:column;align-items:center;width:96px;cursor:pointer;padding:4px 2px;border-radius:8px}
.cpl:hover{background:rgba(255,255,255,.06)}
.cpl.pend{box-shadow:inset 0 0 0 1px var(--amber)}
.cpn{font-size:12px;font-weight:600;margin-top:3px;max-width:94px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.cpv{font:600 12px 'Geist Mono',monospace;color:var(--mint)}
.ctag{position:absolute;top:0;right:6px;font:700 9.5px 'Geist',sans-serif;padding:1px 5px;border-radius:4px}
.ctag.out{background:rgba(255,90,110,.2);color:#FF8FA3}.ctag.in{background:rgba(61,220,151,.2);color:#3DDC97}
.cpl.moved .cpn{color:#fff}
.cmark{position:absolute;top:2px;left:8px;color:var(--amber);display:flex}
.cbench{background:rgba(0,0,0,.35);margin:0 -8px;padding:10px 8px 0;border-radius:0 0 12px 12px}
.cbench .lb{display:block;text-align:center;font-size:11px;color:var(--mute);margin-bottom:6px}
/* wave 3: Players hub and player compare */
.hubctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-4px 0 14px}
.hubctl input,.hubctl select{min-height:0;padding:6px 9px;font-size:13px;width:auto}
.hub table{width:100%}
.hub th{font-size:12px;color:var(--mute);padding:9px 10px;background:var(--ink2)}
.hub th.act{color:var(--mint)}
.hub td{padding:8px 10px;font-family:'Geist',sans-serif;vertical-align:middle}
.hub td.fig{text-align:right;font-family:'Geist Mono',monospace;font-size:13px;white-space:nowrap}
.hub td.fig.mint{color:var(--mint);font-weight:600}
.hub tr.mine td{background:rgba(61,220,151,.04)}
.hub tr.ticked td{background:rgba(255,255,255,.05)}
.pcell{display:flex;align-items:center;gap:9px;min-width:0}
.pmeta{display:flex;flex-direction:column;gap:3px;min-width:0}
.prow1{display:flex;align-items:center;gap:6px}
.prow2{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute)}
.prow2 .sigs{justify-content:flex-start}
.pn{background:none;border:0;padding:0;min-height:0;font:600 13px 'Geist',sans-serif;color:var(--cream);cursor:pointer;text-align:left}
.pn:hover{color:var(--mint);text-decoration:underline}
.pn.big{font-size:15px}
.tick{width:16px;height:16px;accent-color:var(--mint);cursor:pointer}
.pcp{font-size:11px;margin-left:3px}
.fxrow{display:inline-flex;gap:3px;flex-wrap:nowrap}
.blankpill{background:var(--ink3);color:var(--mute);font-size:10px;padding:1px 6px}
.cmgrid{display:grid;gap:8px;align-items:stretch}
.cmh{display:flex;gap:10px;align-items:flex-start;background:#141414;border-radius:12px;box-shadow:inset 0 0 0 1px var(--ring);padding:12px;position:relative}
.cmh .mx{position:absolute;top:6px;right:6px}
.cml{display:flex;align-items:center;font-size:13px;color:var(--mute)}
.cmc{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#141414;border-radius:10px;box-shadow:inset 0 0 0 1px var(--ring);padding:10px 12px;min-height:46px}
.cmc.best{box-shadow:inset 3px 0 0 var(--mint),inset 0 0 0 1px rgba(61,220,151,.35)}
.cmc.empty{color:var(--mute)}
.cmv{font:600 20px 'Geist',sans-serif;letter-spacing:-.01em}.cmv.sm{font-size:15px}
/* wave 4: Signals board */
.sbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:18px}
.sbcard{background:#141414;border-radius:12px;box-shadow:inset 0 0 0 1px var(--ring);padding:12px 14px}
.sbcard header{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.sbcard header .tile{width:26px;height:26px}
.sbcard h3{font:600 14px 'Geist',sans-serif;letter-spacing:0;margin:0}
.sbc{margin-left:auto;font:600 12px 'Geist Mono',monospace;color:var(--mute)}
.sbrow{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:10px;padding:6px 0;border-top:1px solid rgba(255,255,255,.05);cursor:pointer}
.sbrow:hover .sbn{color:var(--mint)}
.sbn{font-size:13px;font-weight:600}.sbm{font-size:11.5px;color:var(--mute);grid-column:1}
.sbv{grid-column:2;grid-row:1/3;align-self:center;font:600 14px 'Geist Mono',monospace;color:var(--mint)}
.sbmore{font-size:12px;color:var(--mute);padding-top:6px}.sbmore a{color:var(--cyan)}
.pagetabs .pseg button{padding:6px 14px;font-size:13px}
.pagetabs .pseg button.on{background:#EDEDED;color:#0A0A0A}
.fleg{font-size:13px;margin-bottom:5px}.fsum{font-size:13px;border-top:1px solid var(--ink3);padding-top:6px;margin-top:4px}
.sqshape{display:grid;grid-template-columns:repeat(auto-fit,minmax(640px,1fr));gap:12px}
@media(max-width:700px){.sqshape{grid-template-columns:1fr}}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:720px){.g2{grid-template-columns:1fr}}
.wdl{display:inline-flex;gap:3px}.wdl i{font:700 10px 'Geist Mono',monospace;font-style:normal;width:17px;height:17px;border-radius:4px;display:inline-grid;place-items:center}
.wdl i.W{background:rgba(61,220,151,.22);color:#3DDC97}.wdl i.D{background:rgba(255,255,255,.08);color:var(--mute)}.wdl i.L{background:rgba(255,90,110,.2);color:#FF8FA3}
/* Teams (redesign 12 Nov 2026): Fixture Grid and Matches. Figures are plain;
   colour is kept for the fixtures alone. */
.tg-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0 14px}.tg-top h1{margin:0}
.tg-views{display:inline-flex;background:#0A0A0A;border-radius:12px;padding:3px;box-shadow:inset 0 0 0 1px #262626}
.tg-views button{border:0;background:none;box-shadow:none;color:var(--mute);font:600 14px 'Geist',sans-serif;padding:8px 18px;border-radius:9px;min-height:0}
.tg-views button.on{background:#EDEDED;color:#0A0A0A}
.tg-key{display:inline-flex;align-items:center;gap:4px;height:38px;font-size:11.5px;color:var(--mute)}.tg-key>span{margin:0 4px}
.tg-key i{font:600 11px 'Geist Mono',monospace;font-style:normal;width:22px;height:22px;border-radius:6px;display:grid;place-items:center}
.tg-panel{background:#0F0F0F;border-radius:14px;box-shadow:inset 0 0 0 1px var(--ring);overflow:hidden}
.tg-scroll{overflow-x:auto;container-type:inline-size}
.tg-t{border-collapse:separate;border-spacing:0;width:100%;font:500 13px 'Geist',system-ui,sans-serif}.tg-t b{font-family:'Geist',system-ui,sans-serif}
.tg-t th{font:500 11.5px 'Geist',sans-serif;color:var(--mute);text-align:center;padding:10px 7px;background:#0F0F0F;border-bottom:1px solid #1E1E1E;white-space:nowrap;vertical-align:bottom}
.tg-t th[onclick]{cursor:pointer}.tg-t th[onclick]:hover{color:var(--cream)}
.tg-t th small{display:block;font-size:10.5px;color:#5E5E5E;font-weight:400;margin-top:1px}
.tg-t th.act{color:var(--cream)}.tg-t th.r{text-align:right}
.tg-t th.tg-s{text-align:right;min-width:62px}
.tg-t th.tg-gw{font-size:11px}.tg-t th.tg-gw.in{color:#D4D4D4}
.tg-t td{padding:6px 7px;border-bottom:1px solid #191919;text-align:center;white-space:nowrap;background:#0F0F0F}
.tg-t tr.tg-r:hover>td{background:#151515}
.tg-t td.r{text-align:right}.tg-t td.mono{font:500 13px 'Geist Mono',monospace;color:#9A9A9A}
.tg-t td.tg-n{text-align:right;font:500 13.5px 'Geist Mono',monospace;color:#9A9A9A}
.tg-t td.tg-n.act{color:var(--cream);font-weight:600}
.tg-t .tg-club{position:sticky;left:0;z-index:2;text-align:left;padding-left:14px;min-width:168px;box-shadow:1px 0 0 #222}
.tg-t th.tg-club{z-index:3}
.tg-gap{padding-right:16px!important;box-shadow:inset -1px 0 0 #1E1E1E}
.tg-cb{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;box-shadow:none;padding:0;min-height:0;color:var(--cream);font:inherit;text-align:left;cursor:pointer}
.tg-cb b{font-weight:600}.tg-car{margin-left:auto;color:#555;font-size:11px}
.tg-r{cursor:pointer}
.tg-form{display:inline-flex;gap:2px}
.tg-form i{position:relative;cursor:default;font:600 9.5px 'Geist Mono',monospace;font-style:normal;width:15px;height:15px;border-radius:4px;display:grid;place-items:center;color:#0A0A0A}
.tg-form i.W{background:#3DDC97}.tg-form i.D{background:#5E5E5E;color:#EDEDED}.tg-form i.L{background:#F0506E}
.tg-form i:hover::after,.tg-form i:focus-visible::after{content:attr(data-tt);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);white-space:pre;background:#1C1C1C;color:var(--cream);font:500 12px/1.45 'Geist',system-ui,sans-serif;padding:7px 10px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.6),inset 0 0 0 1px #333;z-index:30;text-align:left;pointer-events:none}
.tg-form i:hover::before,.tg-form i:focus-visible::before{content:'';position:absolute;left:50%;bottom:calc(100% + 3px);transform:translateX(-50%) rotate(45deg);width:9px;height:9px;background:#1C1C1C;box-shadow:1px 1px 0 #333;z-index:31}
.tg-form i:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.tg-fx{display:inline-block;width:40px;padding:4px 0;border-radius:6px;font:700 10.5px 'Geist',sans-serif;letter-spacing:.02em;cursor:pointer}
.tg-fx+.tg-fx{margin-left:2px}.tg-fx.aw{font-style:italic;font-weight:600}.tg-fx.bl{background:#1A1A1A;color:#555;cursor:default}
.tg-t td.tg-gw:not(.in){opacity:.4}
.tg-t tr.open>td{background:#151515;border-bottom-color:transparent}
.tg-drawer>td{background:#121212!important;padding:0!important;text-align:left;border-bottom:1px solid #222}
.tg-dr{position:sticky;left:0;width:100cqw;box-sizing:border-box;display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr;gap:12px;padding:14px 16px 16px;white-space:normal;font-family:'Geist',system-ui,sans-serif}
.tg-dr section{background:#0C0C0C;border-radius:12px;box-shadow:inset 0 0 0 1px #1F1F1F;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tg-dr h4{margin:0 0 4px;font:600 12px 'Geist',sans-serif;color:var(--mute)}
