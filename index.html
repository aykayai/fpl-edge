<style>
:root{
 /* FPL Edge — purple base, green primary, teal secondary, orange accent.
    Fixture difficulty, price arrows, kits and the pitch keep their own
    meaning-carrying colours and are deliberately not themed. */
 --ink:#0C0E12;--ink2:#141820;--ink3:#222834;--line:#303845;
 --mint:#2DDC87;--cyan:#5BE8C0;--amber:#FF8A3D;
 --cream:#EDF1F6;--mute:#8494A8;--sky:#5BE8C0;--skyDeep:#12657F;--red:#FF5470;
 --d5:#5C0011;--d4:#E01E37;--d3:#F0A02A;--d2:#3FBF63;--d1:#7DFB9E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ink);color:var(--cream);font-family:'Sora',system-ui,sans-serif;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:10px;width:100%}
.wrap>*{max-width:100%}
.stick{position:sticky;top:0;z-index:60;background:var(--ink);padding-top:6px;width:100%;
 box-shadow:0 10px 22px -14px rgba(0,0,0,.9)}
.gwhead{display:flex;align-items:center;gap:8px;flex:none}
.gwhead .lbl{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);font-weight:800}
.ministats{display:flex;gap:10px;align-items:center;background:#06070A;
 border:1px solid var(--ink3);border-radius:14px;padding:8px 10px;margin-bottom:7px}
.msrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;flex:1;min-width:0}
.mspill{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
 background:var(--ink2);border:1px solid var(--ink3);border-radius:10px;padding:6px 4px;min-width:0}
.msk{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:800;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.msv{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;line-height:1;white-space:nowrap}
.gwpill{display:flex;align-items:center;gap:6px;flex:none;background:rgba(255,138,61,.14);
 border:1px solid var(--amber);border-radius:12px;padding:5px 7px}

 padding:5px 9px;border-radius:8px;font-size:12px;line-height:1}

.gwv{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;color:var(--amber);

@media(max-width:820px){.msrow{grid-template-columns:repeat(3,minmax(0,1fr))}}

 .gwpill{width:100%;justify-content:center}.msv{font-size:16px}}

 display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0;letter-spacing:.03em}
.mono{word-break:break-all;font-family:'IBM Plex Mono',monospace}
.panel{background:var(--ink2);border:1px solid var(--ink3);border-radius:14px;margin-bottom:12px;overflow:hidden}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;

.pbody{padding:14px}

button:hover{border-color:var(--line)}
button.on{background:var(--mint);color:var(--ink);border-color:var(--mint)}

.nav{margin-bottom:10px}
.navbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

.navitems{display:flex;gap:5px;flex-wrap:wrap}

.navmob{display:none;position:relative}

.navsheet{position:absolute;left:0;right:0;top:52px;z-index:40;background:var(--ink2);

.card{width:calc(20% - 4px);max-width:132px;position:relative}

.kit{display:flex;justify-content:center;position:relative}
.namebar{background:rgba(10,4,18,.92);border-radius:5px 5px 0 0;display:flex;align-items:center;
 justify-content:space-between;gap:3px;padding:2px 4px;margin-top:-2px;cursor:pointer}

.lname:hover{color:var(--mint);text-decoration:underline}

.tag.c{background:var(--cream);color:var(--ink)}.tag.v{background:var(--cyan);color:var(--ink)}
.tag.s{background:var(--ink3);color:var(--mute)}

.pcard{position:relative;width:100%;max-width:380px;max-height:90vh;overflow:auto;

.pcx{position:absolute;top:12px;right:12px;padding:4px 10px;border-radius:8px}
.pchead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.pcimgwrap{width:88px;height:112px;border-radius:14px;overflow:hidden;background:

 justify-content:center;margin-bottom:8px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.pcname{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:28px;line-height:1.02}

.pcgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.pcs{background:var(--ink);border:1px solid var(--ink3);border-radius:10px;padding:8px 9px}

.pcs .v{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;margin-top:2px}
.pclab{margin-top:16px;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);font-weight:800}
.pcbars{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.pcbar{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.pcbar .pv{font-size:10.5px;font-family:'IBM Plex Mono',monospace;color:var(--cream)}

@media(max-width:999px){.hideSm{display:none}}
.chipblock{padding:12px 14px;border-bottom:1px solid var(--ink3)}
.chiphead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}

.chipbest{margin-top:6px;font-size:12px;color:var(--mint)}
.chiplocked{margin-top:7px;display:flex;justify-content:space-between;align-items:center;gap:10px;

.tl{display:flex;gap:3px;align-items:flex-end;margin-top:10px;overflow-x:auto;padding-bottom:2px}

.tlweek.sel .tlbar{background:var(--amber)}
.tlnum{font-size:8.5px;color:var(--mute);font-family:'IBM Plex Mono',monospace}
.tlweek.sel .tlnum{color:var(--amber);font-weight:800}
.tlweek.best .tlnum{color:var(--mint)}
.gwband{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:9px 13px;
 background:var(--ink);font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:var(--mint);
 border-top:1px solid var(--ink3);border-bottom:1px solid var(--ink3)}
.gwdl{letter-spacing:.03em;text-transform:none;color:var(--cream);font-weight:600}
.chipzone{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding:12px;background:#141820;border-top:1px solid var(--ink3)}

.chipzone button.on{background:var(--amber);border-color:var(--amber);color:#241000}
.repl{background:rgba(4,245,255,.07);border-bottom:1px solid var(--ink3)}
.poolsigs{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.poolsigs .sigs,.poolsigs>span{display:contents}
.poolsigs .sig{width:14px;height:15.1px}
.poolsigs .sigs{gap:3px}
.fbtn{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 8px;border-radius:999px;
 border:1px solid var(--ink3);background:var(--ink2);color:var(--cream);font-size:11.5px;
 font-weight:600;cursor:pointer;transition:border-color .12s,background .12s}
.fbtn:hover{border-color:var(--line)}
.fbtn.on{border-color:var(--fc);background:color-mix(in srgb,var(--fc) 18%,var(--ink2));color:#fff}
@media(max-width:520px){.fbtn{padding:5px 10px 5px 7px;font-size:11px;gap:5px}}
.chipbtn{font-size:10.5px;padding:5px 9px}
.fixrow{display:flex;align-items:center;gap:6px;padding:5px 10px;border-bottom:1px solid var(--ink3);font-size:11.5px}
.fixteam{flex:1;display:flex;align-items:center;gap:5px;min-width:0}
.fixteam.away{justify-content:flex-end;text-align:right}
details>summary{cursor:pointer;padding:11px 14px;font-family:'Barlow Condensed',sans-serif;
 text-transform:uppercase;font-size:16px;font-weight:700;letter-spacing:.08em;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:" ▾";color:var(--mute)}
details[open]>summary::after{content:" ▴"}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:var(--ink)}
::-webkit-scrollbar-thumb{background:var(--ink3);border-radius:4px}
