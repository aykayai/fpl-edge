<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FPL Signals - Planner &amp; Assistant</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A0A">
<meta property="og:title" content="FPL Signals">
<meta property="og:description" content="Signals for every Fantasy Premier League decision.">
<meta property="og:image" content="og-image.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FPL Signals">
<meta name="description" content="FPL Signals - Fantasy Premier League planner, projections and transfer assistant.">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
 /* FPL Signals - Look A (13 Oct 2026): the Fintel/Jeevs house style
    (neutral greys, 5% ring, radii 6/8/12, white primary controls); the app
    keeps its green figures and orange gameweek so the three apps stay
    distinguishable. Fixture difficulty, price arrows, kits and the pitch
    keep their own meaning-carrying colours and are deliberately not themed. */
 --ink:#0A0A0A;--ink2:#171717;--ink3:#262626;--line:#404040;--ring:rgba(255,255,255,.06);
 --mint:#2DDC87;--cyan:#5BE8C0;--amber:#FF8A3D;
 --cream:#EDEDED;--mute:#A3A3A3;--sky:#5BE8C0;--skyDeep:#12657F;--red:#FF5470;
 --d5:#5C0011;--d4:#E01E37;--d3:#F0A02A;--d2:#3FBF63;--d1:#7DFB9E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ink);color:var(--cream);font-family:'Geist',system-ui,sans-serif;font-size:14px}
/* Redesign wave 1 (19 Oct 2026): every page uses the full screen width.
   12 Nov 2026 (Andy): more room at the sides, like the official site: the
   gutter grows with the screen, about 60px on his 1536px laptop, at most
   64px, and 16px on a phone. */
:root{--gut:clamp(24px,4vw,64px)}
@media(max-width:520px){:root{--gut:16px}}
.wrap{max-width:none;margin:0;padding:0 var(--gut) 24px;width:100%}
.wrap>*{max-width:100%}
/* one sticky bar: logo, eight pages, GW switcher, deadline, live dot;
   Predicted, Bank and FT join it once the page scrolls (body.scrolled) */
.tb{position:sticky;top:0;z-index:60;background:rgba(10,10,10,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 border-bottom:1px solid rgba(255,255,255,.07);margin:0 calc(-1*var(--gut)) 22px;padding:0 var(--gut)}
/* the bar runs edge to edge: .wrap>* would cap it at the content width */
.wrap>.tb{max-width:none}
.tbin{height:62px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;font:600 16px 'Geist',sans-serif;color:#fff;text-decoration:none;flex:none}
.brand .bl svg{width:32px;height:32px;display:block}
.tn{display:flex;gap:2px;margin-right:auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.tn::-webkit-scrollbar{display:none}
.tn .navlink{font:500 14px 'Geist',sans-serif;color:#9A9A9A;padding:8px 13px;border-radius:999px;text-decoration:none;white-space:nowrap;border:0}
.tn .navlink:hover{color:var(--cream);background:rgba(255,255,255,.06)}
.tn .navlink.on{color:#0A0A0A;background:#EDEDED}
.tr{display:flex;align-items:center;gap:16px;flex:none}
.tbfig{display:none;gap:16px;font-size:13px;color:#9A9A9A}
.tbfig b{color:#EDEDED;font-family:'Geist Mono',monospace;font-weight:500;margin-left:4px}
.tbfig b.mint{color:var(--mint)}
body.scrolled .tbfig{display:flex}
.gwsw{display:inline-flex;align-items:center;background:#171717;border-radius:999px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.gwsw button{background:none;border:0;color:#9A9A9A;font-size:16px;padding:6px 10px;min-height:0;border-radius:999px}
.gwsw button:hover{color:var(--cream)}
.gwsw b{font:600 14px 'Geist',sans-serif;color:#FF9A3D;min-width:40px;text-align:center}
.dl{display:grid;grid-template-columns:auto auto;column-gap:6px;line-height:1.15;font-size:12px}
.dl b{font:600 13px 'Geist',sans-serif;color:#EDEDED}
.dlk{color:#7A7A7A;font-size:11px}.dl .dlk:first-child{grid-column:1/-1}.dlk.soon{color:var(--amber)}
.live{display:grid;place-items:center;width:22px;height:22px}
.live i{display:block;width:9px;height:9px;border-radius:50%;background:#3DDC97;box-shadow:0 0 0 4px rgba(61,220,151,.15)}
.live.wait i{background:var(--amber);box-shadow:0 0 0 4px rgba(255,138,61,.18)}
.live.live i{animation:sigpulse 1.6s ease-in-out infinite}
@media(max-width:1100px){.dl{display:none}body.scrolled .tbfig{display:none}}
@media(max-width:720px){.tbin{gap:12px}.brand .bw{display:none}.tn .navlink{padding:7px 10px;font-size:13px}}
@media(max-width:520px){.tb{margin-bottom:16px}.tbin{height:54px}.gwsw b{min-width:34px}.gwsw button{padding:5px 7px}}
/* Planner hero: team name + four figure cards */

.pagetabs{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.pagetabs h1{font:600 24px 'Geist',sans-serif;letter-spacing:-.01em}
.pagetabs .pseg a{display:inline-block;padding:6px 14px;font-size:13px;font-weight:600;color:var(--cream);text-decoration:none}
.pagetabs .pseg a+a{border-left:1px solid rgba(255,255,255,.12)}
.pagetabs .pseg a.on{background:#EDEDED;color:#0A0A0A}
.btnlink{display:inline-flex;align-items:center;padding:6px 12px;border-radius:8px;background:var(--ink2);box-shadow:inset 0 0 0 1px var(--line);color:var(--cream);font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap}
.btnlink:hover{background:var(--ink3)}
/* wave 2: This Week strip, pop-ups, Compare */
.week{margin-bottom:14px}.weekh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.weekh h2{font:600 15px 'Geist',sans-serif;letter-spacing:0}
.hz{display:inline-flex;background:#171717;border-radius:999px;padding:3px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.hz button{background:none;border:0;color:#9A9A9A;font:500 12.5px 'Geist',sans-serif;padding:5px 12px;border-radius:999px;min-height:0}
.hz button.on{background:#EDEDED;color:#0A0A0A}
/* compact This Week cards (12 Nov 2026): icon left, title / figure / line */
.wkrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.wk{display:grid;grid-template-columns:28px minmax(0,1fr) auto;column-gap:10px;align-items:center;text-align:left;background:#141414;border:0;border-radius:12px;box-shadow:inset 0 0 0 1px var(--ring);padding:10px 12px;cursor:pointer;color:var(--cream);font:inherit;min-width:0}
.wk:hover{box-shadow:inset 0 0 0 1px var(--line)}
.wk .wkh{display:contents}.wk .wkh .tile{grid-row:1/4;grid-column:1;width:28px;height:28px}
.wkt{grid-row:1;grid-column:2;font-size:12px;line-height:16px;color:#9A9A9A;font-weight:500}
.chev{grid-row:1/4;grid-column:3;color:#5A5A5A;display:flex}
.wkf{grid-row:2;grid-column:2;font:600 15px/20px 'Geist',sans-serif;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkf .cx{font-family:'Geist Mono',monospace;color:#FFB020;font-size:14px;margin-left:4px}
.wkl{grid-row:3;grid-column:2;font-size:12px;line-height:16px;color:#9A9A9A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wkl b{font-weight:600}
@media(max-width:1100px){.wkrow{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* phones: one row you swipe sideways */
@media(max-width:620px){.wkrow{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:2px}
 .wkrow::-webkit-scrollbar{display:none}.wk{flex:0 0 74%;scroll-snap-align:start}}
/* phone: the page menu gets its own full-width row under the logo and GW */
@media(max-width:720px){.tbin{flex-wrap:wrap;height:auto;padding:8px 0 6px;row-gap:6px}.tn{order:3;width:100%;margin:0}.tr{margin-left:auto}}
.up{color:var(--mint)}.dn{color:var(--red)}
.modal{position:fixed;inset:0;z-index:150;background:rgba(4,6,9,.72);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
.mbox{background:#121212;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line),0 24px 80px rgba(0,0,0,.7);width:100%;max-width:760px}
.mbox.wide{max-width:min(1480px,100%)}
.mhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--ink3);position:sticky;top:-24px;background:#121212;z-index:2;border-radius:14px 14px 0 0;flex-wrap:wrap}
.mhead h2{font:600 18px 'Geist',sans-serif;letter-spacing:0;margin-right:auto}
.mx{background:none;border:0;color:var(--mute);padding:6px;display:flex;min-height:0}.mx:hover{color:var(--cream)}
.mbody{padding:16px 18px 18px}
.mbody .panel{margin-top:14px}

.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media(max-width:900px){.cgrid{grid-template-columns:1fr}}

/* wave 3: Players hub and player compare */

.pcell{display:flex;align-items:center;gap:9px;min-width:0}
.pmeta{display:flex;flex-direction:column;gap:3px;min-width:0}
.prow1{display:flex;align-items:center;gap:6px}
.prow2{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute)}
.prow2 .sigs{justify-content:flex-start}
.pn{background:none;border:0;padding:0;min-height:0;font:600 13px 'Geist',sans-serif;color:var(--cream);cursor:pointer;text-align:left}
.pn:hover{color:var(--mint);text-decoration:underline}
.pn.big{font-size:15px}
.tick{width:16px;height:16px;accent-color:var(--mint);cursor:pointer}

/* Compare pop-up and tray (20 Nov 2026): cp* classes only. No coloured edge
   stripes (Andy's rule): a player's colour is the ring on his photo and the
   dot by his name. */
.cpbody{display:flex;flex-direction:column;gap:16px}
.cpchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12px;background:rgba(61,220,151,.12);color:var(--mint);margin:0 auto 0 12px;white-space:nowrap}
.cpseg{margin:0 10px 0 0}
.mhead:has(.cpchip) h2{margin-right:0}
.cppanel{background:#141414;border-radius:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);padding:14px}
.cpph2{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:2px 6px 6px;font-size:13.5px}
.cpph2 b{font-weight:600}.cpph2>span{font-size:11.5px;color:#6E6E6E}
.cpleg{display:inline-flex;gap:14px;font-size:12px;color:#9A9A9A;flex-wrap:wrap}
.cpleg i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:6px}
.cpscout{display:grid;grid-template-columns:36px 1fr auto;column-gap:14px;align-items:start;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,rgba(232,116,59,.10),rgba(232,116,59,.02) 55%),#151515;box-shadow:inset 0 0 0 1px rgba(232,116,59,.22)}
.cpav{width:36px;height:36px;margin-top:1px}.cpav svg{width:36px;height:36px;display:block}
.cphl{font-size:17px;font-weight:650;letter-spacing:-.01em;line-height:1.25}
.cpmt{font-size:12px;color:#8A8A8A;margin:2px 0 8px}
.cppt{display:grid;grid-template-columns:20px 1fr;gap:9px;font-size:13.5px;line-height:1.45;color:#D6D3CD;margin:6px 0 0}
.cppt i{width:20px;height:20px;border-radius:99px;display:grid;place-items:center;margin-top:1px}
.cppt b{color:#fff;font-weight:600}
.cpask{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:8px 14px;background:#E8743B;color:#0A0A0A;font:600 12.5px 'Geist',sans-serif;white-space:nowrap;min-height:0;cursor:pointer}
.cpask:hover{background:#F08A55}
/* full screen, no scrolling: two columns per view, sized to the window */
/* every pop-up is a full-window panel (20 Nov 2026, Andy) */
.mbox.mfull{max-width:none;height:calc(100vh - 24px);height:calc(100dvh - 24px);display:flex;flex-direction:column}
.modal:has(.mbox.mfull){align-items:stretch;padding:12px}
.mbox.mfull .mhead{position:static;flex:none;padding:12px 18px}
.mbox.mfull .mbody{flex:1;min-height:0;overflow:auto;padding:14px 18px 16px}
/* a window too short for the pop-up: natural heights and a scroll, never a cut (popFit) */
@media(min-width:761px){.mbox.mfull.mscroll .mbody{overflow-y:auto!important}}

.poptabs{margin-right:10px}

.mbox.mfull .cgrid{margin-top:12px}

.mbox.cpfull .cpbody{height:100%}
.cprgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;height:100%}

.cpcol{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.cprad{flex:1;min-height:220px;display:flex;flex-direction:column}
.cpradsvg{flex:1;min-height:0;position:relative}
.cpradsvg svg{position:absolute;inset:0;width:100%;height:100%}
.cpline{flex:none;padding:10px 14px}
.cpwins.cppanel{margin:0;padding:12px 14px;flex-wrap:wrap;row-gap:8px}
.cpwins .cpwbar{min-width:120px}

.cpinsl{display:flex;flex-direction:column;gap:8px}
.cpins{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:9px 14px;border-radius:16px;background:#151515;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.cpav2{width:58px;height:58px;border-radius:99px;overflow:hidden;background:linear-gradient(160deg,var(--k),#151515);box-shadow:0 0 0 2px var(--c);display:grid;place-items:end center;flex:none}
.cpav2 .cpimg{width:52px;margin-bottom:-2px;display:block}
.cpav2 .cpfb{place-items:center;width:100%;height:100%}
.cpav2.sm{width:44px;height:44px}.cpav2.sm .cpimg{width:40px}
.cpnm{display:flex;align-items:center;gap:7px;font-size:15px}
.cpnm>i{width:8px;height:8px;border-radius:99px;flex:none}
.cpnm .pn{font-size:15px;font-weight:650}
.cppick{white-space:nowrap;flex:none;font-size:10.5px;color:#E8743B;border:1px solid rgba(232,116,59,.5);border-radius:999px;padding:1px 7px}
.cpm{font-size:11.5px;color:#8A8A8A;margin:1px 0 5px}
.cpchips{display:flex;flex-wrap:wrap;gap:5px}
.cpchips span{font-size:11px;border-radius:999px;padding:2px 8px}
.cpchips .up{background:rgba(61,220,151,.12);color:var(--mint)}
.cpchips .dn{background:rgba(255,122,154,.12);color:#FF8FAB}
.cpfx{white-space:nowrap}
.cpxp{text-align:right;min-width:74px;font:700 22px 'Geist Mono',monospace;letter-spacing:-.02em}
.cpxp small{display:block;font:500 10.5px 'Geist',sans-serif;color:#6E6E6E;margin-top:2px}
.cpscroll{overflow-x:auto}
.cpstats{min-width:640px}
.mbox.cpfull .cpsfill{height:100%}
.mbox.cpfull .cpstats{display:flex;flex-direction:column;min-height:100%}
.cpwins{margin:8px 0 2px}
.mbox.cpfull .cpstats>.cprows:not(:first-child){flex:1 1 auto;align-content:space-evenly}
.cprows{display:grid;align-items:center;column-gap:12px;row-gap:2px}
.cpnote{align-self:end;color:#6E6E6E;font-size:11.5px;line-height:1.45;padding-bottom:4px}
.cphero{position:relative;min-height:136px;border-radius:16px;overflow:hidden;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;isolation:isolate}
.cphero:before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(8,8,8,.72),rgba(8,8,8,.25) 55%,rgba(8,8,8,0) 75%),linear-gradient(150deg,var(--k) 0%,color-mix(in srgb,var(--k) 45%,#0E0E0E) 60%,#121212 100%)}
.cphero:after{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px)}
.cphero .cpph{position:absolute;right:4px;bottom:0;height:128px;z-index:-1;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.cphero .cpph.cpfb{width:104px;place-items:end center}
.cpdot{position:absolute;top:12px;right:12px;width:12px;height:12px;border-radius:99px;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.cpht{position:relative;max-width:60%}
.cphero{container-type:inline-size}
.cphm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@container (max-width:200px){.cpht{max-width:100%}.cphero .cpph{height:72px;opacity:.55}.cphn .pn{font-size:15px}.cpbig{font-size:21px}.cphm{font-size:10.5px}.cpsig .tile{transform:scale(.88)}}
.cphn .pn{font:700 19px 'Geist',sans-serif;letter-spacing:-.02em;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.cphm{font-size:11.5px;color:rgba(255,255,255,.8);margin-top:2px}
.cpsig{margin-top:6px}
.cpbig{font:700 28px 'Geist Mono',monospace;letter-spacing:-.03em;line-height:1}
.cpbl{font-size:11px;color:rgba(255,255,255,.7);white-space:nowrap}
.cphero>.cpht:last-child{display:flex;align-items:baseline;gap:8px}
.cphero .cpsig .tile{width:24px;height:24px}
.cpwins{display:flex;align-items:center;gap:14px;margin:10px 0 2px;padding:10px 14px;border-radius:14px;background:#161616;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);font-size:13.5px}
.cpwins b{font-weight:600}
.cpwbar{flex:1;display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px}
.cpsec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6E6E6E;margin:12px 0 3px;display:flex;align-items:center;gap:10px}
.cpsec:after{content:"";flex:1;height:1px;background:rgba(255,255,255,.06)}
.cprl{padding:4px 0;font-size:13px}
.cprl small{display:block;color:#6E6E6E;font-size:11.5px;margin-top:1px}
.cprc{padding:4px 10px;border-radius:8px}
.cpval{display:flex;align-items:baseline;justify-content:space-between;font:500 13px 'Geist Mono',monospace;color:#9A9A9A}
.cpval i{font:500 10.5px 'Geist',sans-serif;font-style:normal;color:#5E5E5E}
.cptr{height:5px;border-radius:99px;background:#222;margin-top:4px;overflow:hidden}
.cptr span{display:block;height:100%;border-radius:99px;background:#4A4A4A}
.cprc.win{background:rgba(61,220,151,.06)}
.cprc.win .cpval{color:#fff}
.cprc.win .cpval b{color:var(--mint);font-size:10px;margin-left:6px}
.cprc.win .cptr span{background:var(--mint)}
.cpdots{justify-content:flex-start;gap:8px;color:#CFCFCF;white-space:nowrap}
.cpdots>span{display:inline-flex;gap:3px}
.cpdots>span i{width:7px;height:7px;border-radius:99px;background:#2E2E2E}
.cpdots>span i.on{background:#F5B841}
/* tray */
.cptrayspace{height:96px}
.cptray{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:16px;padding:10px 10px 10px 20px;border-radius:999px;
  background:rgba(22,22,22,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 0 1px rgba(255,255,255,.09),0 18px 50px rgba(0,0,0,.55);animation:cpup .22s ease-out}
@keyframes cpup{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.cptl{font-size:13px;line-height:1.2}.cptl b{display:block;font-weight:600;font-size:14px}.cptl span{color:#8A8A8A;font-size:12px}
.cpslots{display:flex;gap:8px;padding-bottom:12px}
.cpsw{position:relative}
.cprm{position:absolute;top:-4px;right:-4px;width:19px;height:19px;min-height:0;padding:0;border:0;border-radius:99px;background:#2A2A2A;color:#CFCFCF;display:grid;place-items:center;box-shadow:0 0 0 2px #161616;cursor:pointer}
.cprm:hover{background:#3A3A3A;color:#fff}
.cpsn{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:#9A9A9A;white-space:nowrap}
.cpem{width:44px;height:44px;border-radius:99px;border:1.5px dashed rgba(255,255,255,.16);display:grid;place-items:center;color:#4E4E4E;font-size:18px}
.cpdiv{width:1px;height:34px;background:rgba(255,255,255,.08)}
.cpclr{background:none;border:0;color:#9A9A9A;font-size:13px;padding:8px 6px;min-height:0}
.cpclr:hover{color:var(--cream)}

.mnav,.msheet,.msheet-bg,.pdphbtn{display:none}
@media(max-width:620px){
  /* one slim top row; pages live in the bottom bar */
  .tb .tn{display:none}
  .tbin{flex-wrap:nowrap!important;height:52px!important;padding:0!important;gap:10px!important}
  .tb .tr{margin-left:auto;gap:10px}
  .gwsw button{min-width:40px;min-height:40px;padding:0 10px}
  .gwsw b{font-size:15px}
  .tb .live{display:grid;place-items:center;width:40px;height:40px}
  .wrap{overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:900;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    background:rgba(12,12,12,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.08)}
  .mnav>a,.mnav>button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;
    padding:0;background:none;border:0;border-radius:14px;color:#8E8E8E;font:500 11.5px 'Geist',sans-serif;text-decoration:none;-webkit-tap-highlight-color:transparent}
  .mnav .mi{width:56px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .15s}
  .mnav .on{color:#EDEDED}.mnav .on .mi{background:color-mix(in srgb,var(--mint) 18%,transparent);color:var(--mint)}
  .msheet-bg{display:block;position:fixed;inset:0;z-index:890;background:rgba(0,0,0,.55)}
  .msheet{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:fixed;left:10px;right:10px;z-index:895;
    bottom:calc(78px + env(safe-area-inset-bottom));padding:10px;border-radius:18px;background:#161616;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 18px 50px rgba(0,0,0,.6)}
  .msheet a{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 14px;border-radius:12px;background:#1E1E1E;color:#EDEDED;font:500 15px 'Geist',sans-serif;text-decoration:none}
  .msheet a .mi{color:#9A9A9A;display:grid}.msheet a.on{background:color-mix(in srgb,var(--mint) 14%,#1E1E1E)}.msheet a.on .mi{color:var(--mint)}
  /* The Scout lives in the top bar on a phone (floating, it covered pitch
     players), slides away with the bar, and steps aside for pop-ups */
  .scx-btn{top:calc(6px + env(safe-area-inset-top))!important;right:12px!important;bottom:auto!important;width:40px!important;height:40px!important;transition:transform .22s ease!important}
  .scx-btn svg{width:40px!important;height:40px!important}
  .scx-btn:hover{transform:none}
  .tb .tr{margin-right:46px}
  body.tbhide .scx-btn{transform:translateY(-64px)!important}
  body:has(.modal) .mnav,body:has(.modal) .scx-btn,body:has(.scx-panel.open) .mnav{display:none!important}
  /* every (i) keeps its look but takes a finger-sized tap */
  .fci::after,.infoi::after{content:"";position:absolute;inset:-11px}
  html,body{overflow-x:clip}
  .fci,.infoi{position:relative}
  /* fixture chips readable in pool rows (doubles were 8px) */
  .fxdbl .fxc{height:13px;font-size:9.5px}
  .cx-fx{font-size:9.5px!important}.cx-rmk{font-size:10px}
  /* Planner: the five figures as a two-column grid, not five full rows */
  .pz-stats{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .pz-stats>:first-child{grid-column:1/-1}
  .pz-st{border-top:1px solid rgba(255,255,255,.06)}
  /* News: four figures two by two */
  .nw-figs{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px}
  /* Chips: the usage table scrolls inside its card instead of widening the page */
  .rb:has(>.cx-ur){overflow-x:auto;scrollbar-width:none}
  /* Player Data: search, position and projection stay; the rest folds behind Filters */
  .pdphbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:10px;border:0;background:#1E1E1E;color:#EDEDED;font:500 14px 'Geist',sans-serif;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
  .pdphbtn b{background:var(--mint);color:#04170E;border-radius:999px;padding:0 6px;font-size:11px}
  .pdphbtn.on{background:#2A2A2A}
  .pdbar{display:flex;flex-wrap:wrap;gap:10px}
  .pdbar .pdsearch{flex:1;min-width:0}
  /* readable small print: pool fixture chips, role tags, week strip, club form */
  .pr2-l2 .fxc{width:30px!important;height:18px!important;font-size:10px!important}
  .pdrole{font-size:10px}.pz-gp{font-size:10.5px}
  .tg-form i{width:17px;height:17px;font-size:10.5px}
  /* Chips: summary two by two; the season roadmap scrolls inside its card; plan boxes one per row */
  .cx-shc{grid-template-columns:repeat(2,minmax(0,1fr))!important;row-gap:12px}
  .rb:has(.cx-rm){overflow-x:auto;scrollbar-width:thin}
  .cx-rm{min-width:760px}
  .cx-rgrid{grid-template-columns:minmax(0,1fr)!important}
  body:has(.msheet) .scx-btn{display:none!important}
  .pdcard:not(.phopen) .pdctl:has(.pdsel),.pdcard:not(.phopen) .pdpricectl,.pdcard:not(.phopen) .pdmorewrap,.pdcard:not(.phopen) .pdsigs{display:none}
}

/* ============ Pixel 7a pass, part 2: sheets, section tabs, hints ============ */
@media(max-width:620px){
  /* pop-ups rise from the bottom as sheets */
  .modal{padding:0!important;align-items:flex-end!important;overflow:hidden!important;animation:mfade .2s ease}
  .modal .mbox{max-width:none!important;width:100%!important;border-radius:24px 24px 0 0!important;max-height:94dvh;display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);animation:mrise .28s cubic-bezier(.2,.8,.2,1)}
  .modal .mbox.mfull{height:94dvh!important}
  .modal .mbox::before{content:"";display:block;flex:none;width:36px;height:4px;border-radius:2px;background:#444;margin:8px auto 2px}
  .modal .mbox .mhead{position:static!important;flex:none;border-radius:0;padding:8px 16px 10px}
  .modal .mbox .mbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
  .modal .mbox:not(:has(.mbody)){overflow-y:auto;overscroll-behavior:contain}
  @keyframes mrise{from{transform:translateY(36%);opacity:.5}to{transform:none;opacity:1}}
  @keyframes mfade{from{background:rgba(4,6,9,0)}}
  /* section tabs under the bar */
  .sectabs{position:sticky;top:52px;z-index:55;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
    margin:-6px -16px 10px;padding:8px 16px 10px;background:linear-gradient(#0A0A0A 78%,rgba(10,10,10,0));transition:top .22s ease}
  .sectabs::-webkit-scrollbar{display:none}
  .sectabs a{flex:none;display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;background:#171717;color:#A3A3A3;
    font:500 13px 'Geist',sans-serif;text-decoration:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);-webkit-tap-highlight-color:transparent}
  .sectabs a.on{background:#EDEDED;color:#0A0A0A;box-shadow:none}
  .secanchor{scroll-margin-top:112px}
  /* the top bar slides away while reading down */
  .tb{transition:transform .22s ease}
  body.tbhide .tb{transform:translateY(-100%)}
  body.tbhide .sectabs{top:0}
  body.tbhide .secanchor{scroll-margin-top:60px}
  /* a fade says "more this way" until the end is reached */
  .sxh:not(.sxend){-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
  /* compact page titles; pressed feedback */
  #main h1{font-size:26px!important;letter-spacing:-.02em}
  button,.mnav a,.msheet a,.sectabs a{transition:transform .08s ease}
  button:active,.mnav a:active,.msheet a:active,.sectabs a:active{transform:scale(.96)}
}
@media(max-width:620px) and (prefers-reduced-motion:reduce){
  .modal,.modal .mbox{animation:none}.tb,.sectabs{transition:none}
}
