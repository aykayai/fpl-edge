<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FPL Signals - Planner &amp; Assistant</title>
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0C0E12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FPL Signals">
<meta name="description" content="FPL Signals - Fantasy Premier League planner, projections and transfer assistant.">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
 /* FPL Signals - Look A (13 Oct 2026): the Fintel/Jeevs house style
    (neutral greys, 5% ring, radii 6/8/12, white primary controls); the app
    keeps its green figures and orange gameweek so the three apps stay
    distinguishable. Fixture difficulty, price arrows, kits and the pitch
    keep their own meaning-carrying colours and are deliberately not themed. */
 --ink:#0A0A0A;--ink2:#171717;--ink3:#262626;--line:#404040;--ring:rgba(255,255,255,.06);
 --mint:#2DDC87;--cyan:#5BE8C0;--amber:#FF8A3D;
 --cream:#EDEDED;--mute:#A3A3A3;--sky:#5BE8C0;--skyDeep:#12657F;--red:#FF5470;
 --d5:#5C0011;--d4:#E01E37;--d3:#F0A02A;--d2:#3FBF63;--d1:#7DFB9E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ink);color:var(--cream);font-family:'Geist',system-ui,sans-serif;font-size:14px}
/* Redesign wave 1 (19 Oct 2026): every page uses the full screen width
   (Andy's 1536px laptop and wider monitors), 24px gutters, 16px on a phone. */
.wrap{max-width:none;margin:0;padding:0 24px 24px;width:100%}
.wrap>*{max-width:100%}
@media(max-width:520px){.wrap{padding:0 16px 16px}}
/* one sticky bar: logo, eight pages, GW switcher, deadline, live dot;
   Predicted, Bank and FT join it once the page scrolls (body.scrolled) */
.tb{position:sticky;top:0;z-index:60;background:rgba(10,10,10,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 border-bottom:1px solid rgba(255,255,255,.07);margin:0 -24px 22px;padding:0 24px}
.tbin{height:62px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;font:600 16px 'Geist',sans-serif;color:#fff;text-decoration:none;flex:none}
.brand .bl svg{width:30px;height:30px;display:block}
.tn{display:flex;gap:2px;margin-right:auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.tn::-webkit-scrollbar{display:none}
.tn .navlink{font:500 14px 'Geist',sans-serif;color:#9A9A9A;padding:8px 13px;border-radius:999px;text-decoration:none;white-space:nowrap;border:0}
.tn .navlink:hover{color:var(--cream);background:rgba(255,255,255,.06)}
.tn .navlink.on{color:#0A0A0A;background:#EDEDED}
.tr{display:flex;align-items:center;gap:16px;flex:none}
.tbfig{display:none;gap:16px;font-size:13px;color:#9A9A9A}
.tbfig b{color:#EDEDED;font-family:'Geist Mono',monospace;font-weight:500;margin-left:4px}
.tbfig b.mint{color:var(--mint)}
body.scrolled .tbfig{display:flex}
.gwsw{display:inline-flex;align-items:center;background:#171717;border-radius:999px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.gwsw button{background:none;border:0;color:#9A9A9A;font-size:16px;padding:6px 10px;min-height:0;border-radius:999px}
.gwsw button:hover{color:var(--cream)}
.gwsw b{font:600 14px 'Geist',sans-serif;color:#FF9A3D;min-width:40px;text-align:center}
.dl{display:grid;grid-template-columns:auto auto;column-gap:6px;line-height:1.15;font-size:12px}
.dl b{font:600 13px 'Geist',sans-serif;color:#EDEDED}
.dlk{color:#7A7A7A;font-size:11px}.dl .dlk:first-child{grid-column:1/-1}.dlk.soon{color:var(--amber)}
.live{display:grid;place-items:center;width:22px;height:22px}
.live i{display:block;width:9px;height:9px;border-radius:50%;background:#3DDC97;box-shadow:0 0 0 4px rgba(61,220,151,.15)}
.live.wait i{background:var(--amber);box-shadow:0 0 0 4px rgba(255,138,61,.18)}
.live.live i{animation:sigpulse 1.6s ease-in-out infinite}
@media(max-width:1100px){.dl{display:none}body.scrolled .tbfig{display:none}}
@media(max-width:720px){.tbin{gap:12px}.brand .bw{display:none}.tn .navlink{padding:7px 10px;font-size:13px}}
@media(max-width:520px){.tb{margin:0 -16px 16px;padding:0 16px}.tbin{height:54px}.gwsw b{min-width:34px}.gwsw button{padding:5px 7px}}
/* Planner hero: team name + four figure cards */
.hero{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:end;margin-bottom:22px}
.hk{font-size:12px;color:#7A7A7A}
.hero h1{margin:4px 0 0;font:600 30px 'Geist',sans-serif;letter-spacing:-.02em}
.hm{font-size:12px;color:#7A7A7A;margin-top:4px}
@media(max-width:900px){.hero{grid-template-columns:1fr;gap:12px}}
.pagetabs{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.pagetabs h1{font:600 24px 'Geist',sans-serif;letter-spacing:-.01em}
.pagetabs .pseg a{display:inline-block;padding:6px 14px;font-size:13px;font-weight:600;color:var(--cream);text-decoration:none}
.pagetabs .pseg a+a{border-left:1px solid rgba(255,255,255,.12)}
.pagetabs .pseg a.on{background:#EDEDED;color:#0A0A0A}
.btnlink{display:inline-flex;align-items:center;padding:6px 12px;border-radius:8px;background:var(--ink2);box-shadow:inset 0 0 0 1px var(--line);color:var(--cream);font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap}
.btnlink:hover{background:var(--ink3)}
/* wave 2: This Week strip, pop-ups, Compare */
.week{margin-bottom:22px}.weekh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.weekh h2{font:600 18px 'Geist',sans-serif;letter-spacing:0}
.hz{display:inline-flex;background:#171717;border-radius:999px;padding:3px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.hz button{background:none;border:0;color:#9A9A9A;font:500 12.5px 'Geist',sans-serif;padding:5px 12px;border-radius:999px;min-height:0}
.hz button.on{background:#EDEDED;color:#0A0A0A}
.wkrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.wk{display:flex;flex-direction:column;align-items:stretch;text-align:left;background:#141414;border:0;border-radius:12px;box-shadow:inset 0 0 0 1px var(--ring);padding:14px 16px;cursor:pointer;color:var(--cream);font:inherit;min-width:0}
.wk:hover{box-shadow:inset 0 0 0 1px var(--line)}
.wkh{display:flex;align-items:center;gap:10px}.wkh .tile{width:30px;height:30px}
.wkt{font-size:13px;color:#9A9A9A;font-weight:500}.chev{margin-left:auto;color:#5A5A5A;display:flex}
.wkf{font:600 19px 'Geist',sans-serif;margin:10px 0 3px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkf .arr{color:#5A5A5A;font-weight:400}.wkf .cx{font-family:'Geist Mono',monospace;color:#FFB020;font-size:17px;margin-left:4px}
.wkl{font-size:13px;color:#BDBDBD;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wkl b{font-weight:600}
.wkft{font-size:12px;color:#7A7A7A;margin-top:auto;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkl+.wkft{margin-top:8px}
@media(max-width:1100px){.wkrow{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){.wkrow{grid-template-columns:1fr 1fr}}
.up{color:var(--mint)}.dn{color:var(--red)}
.modal{position:fixed;inset:0;z-index:150;background:rgba(4,6,9,.72);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
.mbox{background:#121212;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line),0 24px 80px rgba(0,0,0,.7);width:100%;max-width:760px}
.mbox.wide{max-width:min(1480px,100%)}
.mhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--ink3);position:sticky;top:-24px;background:#121212;z-index:2;border-radius:14px 14px 0 0;flex-wrap:wrap}
.mhead h2{font:600 18px 'Geist',sans-serif;letter-spacing:0;margin-right:auto}
.mx{background:none;border:0;color:var(--mute);padding:6px;display:flex;min-height:0}.mx:hover{color:var(--cream)}
.mbody{padding:16px 18px 18px}
.mbody .panel{margin-top:14px}
.mfoot{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.mfoot button{display:inline-flex;align-items:center;gap:6px}
.pseg.mseg{border-color:var(--ink3)}.pseg.mseg button{padding:6px 14px;font-size:12.5px}
.pseg.mseg button.on{background:#EDEDED;color:#0A0A0A}
.fcgrid.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1100px){.fcgrid.c5{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media(max-width:900px){.cgrid{grid-template-columns:1fr}}
.chd{font-size:13px;font-weight:600;margin-bottom:8px}.chd .mu{font-weight:400;font-size:12px}
.cpitch{background:linear-gradient(180deg,#14361f,#0f2a18);border-radius:12px;padding:14px 8px 0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.crow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cpl{position:relative;display:flex;flex-direction:column;align-items:center;width:96px;cursor:pointer;padding:4px 2px;border-radius:8px}
.cpl:hover{background:rgba(255,255,255,.06)}
.cpl.pend{box-shadow:inset 0 0 0 1px var(--amber)}
.cpn{font-size:12px;font-weight:600;margin-top:3px;max-width:94px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.cpv{font:600 12px 'Geist Mono',monospace;color:var(--mint)}
.ctag{position:absolute;top:0;right:6px;font:700 9.5px 'Geist',sans-serif;padding:1px 5px;border-radius:4px}
.ctag.out{background:rgba(255,90,110,.2);color:#FF8FA3}.ctag.in{background:rgba(61,220,151,.2);color:#3DDC97}
.cpl.moved .cpn{color:#fff}
.cmark{position:absolute;top:2px;left:8px;color:var(--amber);display:flex}
.cbench{background:rgba(0,0,0,.35);margin:0 -8px;padding:10px 8px 0;border-radius:0 0 12px 12px}
.cbench .lb{display:block;text-align:center;font-size:11px;color:var(--mute);margin-bottom:6px}
.foot{text-align:center;padding:18px 0 4px;font-size:11px;color:#5A5A5A}
.prov{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px 18px;padding:14px;font-size:12.5px;color:var(--mute)}
.prov b{color:var(--cream);font-weight:600}
/* signal tiles: Lucide line icon in a round tile tinted with its tone */
.tile{border-radius:50%;display:inline-grid;place-items:center;flex:none;width:22px;height:22px;
 background:color-mix(in srgb,var(--tc) 22%,#171717);color:var(--tc)}
.tile svg{width:64%;height:64%;display:block}
.tile.navy{background:#1E40AF;color:#F1F5FF;box-shadow:0 0 0 1.5px #3B6BFF}
.sigs .tile,.sigcell .tile{width:20px;height:20px}
@media(min-width:1000px){.sigs .tile{width:22px;height:22px}}
.sigcell .tile{width:18px;height:18px}
.fbtn-icon .tile{width:22px;height:22px}
/* F83 (bundle 8): figure cards - title with (i), figure, change line */
.fcgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.fc{background:#141414;border-radius:12px;box-shadow:inset 0 0 0 1px var(--ring);padding:14px 16px;min-width:0;position:relative}
.fc.mint{box-shadow:inset 3px 0 0 var(--mint),inset 0 0 0 1px var(--ring)}
.fcb{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:2px}
.fcb .spk{flex:none}
.fsub{font-size:15px;color:#9A9A9A;font-weight:500}
.fct{font-size:13px;font-weight:500;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.fci{position:relative;display:inline-grid;place-items:center;width:18px;height:18px;min-height:0;border-radius:50%;padding:0;font-size:10px;font-weight:700;
 background:rgba(255,255,255,.08);border:0;color:var(--mute);cursor:help;flex:none}
.fci:hover::after,.fci:focus::after{content:attr(data-tip);position:absolute;z-index:80;top:24px;left:-8px;width:240px;white-space:normal;text-align:left;
 background:#1F1F1F;color:var(--cream);font-size:12px;font-weight:400;line-height:1.45;padding:9px 11px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.6),inset 0 0 0 1px var(--line)}
.fcv{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-top:4px;color:#fff;font-variant-numeric:tabular-nums}
.fc.mint .fcv{color:var(--mint)}
.fcc{font-size:12.5px;min-width:0;color:var(--mute);line-height:1.3;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcc .up{color:var(--mint);font-weight:600}.fcc .dn{color:var(--red);font-weight:600}
.hwarn{margin:-8px 0 16px;padding:9px 12px;border-radius:8px;background:rgba(255,84,112,.1);box-shadow:inset 0 0 0 1px rgba(255,84,112,.3);font-size:13px}
@media(max-width:1100px){.fcgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.fcgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.fcb .spk{display:none}
 .fc{padding:10px 11px 8px}.fcv{font-size:22px}.fc:nth-child(even) .fci::after{left:auto;right:-8px}}
h1,h2,h3{font-family:'Geist',system-ui,sans-serif;margin:0;font-weight:600;letter-spacing:.03em}
.mono{word-break:break-all;font-family:'Geist Mono',ui-monospace,monospace}
.panel{background:var(--ink2);border:0;box-shadow:inset 0 0 0 1px var(--ring);border-radius:12px;margin-bottom:12px;overflow:hidden}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;
 border-bottom:1px solid var(--ink3);flex-wrap:wrap}
.phead.bare{border-bottom:none}
.phead h2{font-size:15px;font-weight:600}
.pbody{padding:14px}
button,.btn{font-family:'Geist',system-ui,sans-serif;font-size:13px;font-weight:500;padding:7px 12px;border-radius:8px;
 background:#1F1F1F;color:var(--cream);border:1px solid var(--line);cursor:pointer}
button:hover{border-color:var(--line)}
button.on{background:#fff;color:#0A0A0A;border-color:#fff}
button.pri{background:#fff;color:#0A0A0A;border-color:#fff;font-weight:600}
button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input,select,textarea{background:var(--ink);border:1px solid var(--line);color:var(--cream);border-radius:8px;
 padding:8px 10px;font-family:'Geist',system-ui,sans-serif;font-size:13px;width:100%}
input[type=range]{padding:0;accent-color:var(--mint);border:none;background:none}
.stats{display:flex;flex-wrap:wrap;gap:14px;padding:0 14px 12px}
.stat{flex:1;min-width:82px}
.stat .k{font-size:10px;color:var(--mute);font-weight:700}
.stat .v{font-family:'Geist',system-ui,sans-serif;font-weight:800;font-size:26px;line-height:1.05}
.stat .s{font-size:10px;color:var(--mute)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap}
.pitchctl{position:absolute;top:8px;left:8px;z-index:4;display:flex;gap:6px;flex-wrap:wrap}
.pseg{display:inline-flex;border:1px solid rgba(0,0,0,.4);border-radius:9px;overflow:hidden;
 box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pseg button{border:none;border-radius:0;padding:5px 11px;font-size:11px;font-weight:700;
 background:rgba(10,14,19,.82);color:var(--cream)}
.pseg button+button{border-left:1px solid rgba(255,255,255,.12)}
.pseg button.on{background:var(--amber);color:#20130A}
@media(max-width:520px){.pseg button{padding:4px 9px;font-size:10.5px}}
.pitch{position:relative;background:repeating-linear-gradient(180deg,#14351F 0 42px,#123019 42px 84px);padding:12px 4px 4px}
.row{display:flex;justify-content:center;gap:4px;margin-bottom:10px}
.card{width:calc(20% - 4px);max-width:132px;position:relative}
.card.dim{opacity:.32}
.kit{display:flex;justify-content:center;position:relative}
@media(min-width:1000px){.pitch .kit svg,.benchbar .kit svg{width:48px!important;height:48px!important}}
.namebar{background:rgba(10,4,18,.92);border-radius:5px 5px 0 0;display:flex;align-items:center;
 justify-content:space-between;gap:3px;padding:2px 4px;margin-top:-2px;cursor:pointer}
.namebar .nm{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.namebar .pr{font-size:10px;color:#CFC2E6;white-space:nowrap;font-family:'Geist Mono',ui-monospace,monospace}
.ptsbar{border-radius:0 0 5px 5px;text-align:center;padding:2px 2px 3px;cursor:pointer}
.ptsbar .pv{font-family:'Geist Mono',ui-monospace,monospace;font-weight:600;font-size:13px;line-height:1.15;
 display:flex;align-items:center;justify-content:center;gap:3px}
.ptsbar .pv2{font-size:10px;line-height:1.2;opacity:.9;white-space:nowrap}
.final{font-size:10px;font-weight:800;background:rgba(0,0,0,.28);
 padding:1.5px 3px;border-radius:3px;line-height:1.3}
.fxpill{margin-top:2px;border-radius:4px;padding:1.5px 3px;text-align:center;
 font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.formpill{display:flex;align-items:center;justify-content:center;gap:2.5px;padding:2px 3px}
.formpill svg{flex:none;opacity:.85}
.formlbl{font-size:10px;font-weight:800;opacity:.8}
.formpill b{font-size:10px;font-weight:800;line-height:1}
.ptsbar .fx{font-size:10px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next3{display:flex;gap:2px;margin-top:3px}
.next3 span{flex:1;text-align:center;font-size:10px;line-height:14px;border-radius:3px;
 font-family:'Geist Mono',ui-monospace,monospace;font-weight:600;overflow:hidden}
.badge{position:absolute;width:15px;height:15px;border-radius:50%;font-size:10px;font-weight:800;
 display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;padding:0;z-index:3}
.dot{position:absolute;width:10px;height:10px;border-radius:50%;border:1.5px solid rgba(0,0,0,.55);z-index:3;pointer-events:none}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 12px;
 padding:12px 14px;border-bottom:1px solid var(--ink3);background:rgba(255,255,255,.015)}
.lgi{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mute);min-width:0}
.lgi span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--ink3);border-radius:9px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:7px 12px;font-size:11.5px}
.psrow{display:inline-flex;gap:5px}
.ps{display:flex;flex-direction:column;align-items:center;background:var(--ink);
 border:1px solid var(--ink3);border-radius:7px;padding:3px 7px;min-width:52px}
.ps .k{font-size:10px;color:var(--mute);font-weight:800;white-space:nowrap}
.ps .v{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;font-weight:600}
.sqtable{width:100%;border-collapse:collapse;font-size:12px}
.sqtable th{position:sticky;top:0;background:var(--ink2);padding:8px 7px;font-size:10px;
 color:var(--mute);font-weight:800;cursor:pointer;white-space:nowrap}
.sqtable th.act{color:var(--mint)}
.sqtable td{padding:7px;border-top:1px solid var(--ink3);vertical-align:middle}
.sqtable tr.sub{background:rgba(255,255,255,.025)}
.lname{background:none;border:none;padding:0;color:var(--cream);font-weight:700;font-size:12.5px;cursor:pointer}
.lname:hover{color:var(--mint);text-decoration:underline}
.tag{display:inline-block;background:var(--mint);color:var(--ink);font-size:10px;font-weight:800;padding:1px 6px;
 border-radius:4px;margin-left:5px;margin-right:4px;vertical-align:middle}
.tag.c{background:var(--cream);color:var(--ink)}.tag.v{background:var(--cyan);color:var(--ink)}
