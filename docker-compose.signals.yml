services:
  fpl-signals:
    build:
      context: .
      dockerfile: Dockerfile.signals
    image: fpl-signals
    container_name: fpl-signals
    ports:
      - "127.0.0.1:8090:8090"
    env_file: .env.signals
    environment:
      STATE_DIR: /state
    volumes:
      - signals-state:/state
    # The Scout (12 Nov 2026): Jeevs reaches The Scout's tools as
    # fpl-signals:8090 on this private network, and this server reaches
    # Jeevs on it. Made once by hand: docker network create fpl-scout
    networks:
      - default
      - fpl-scout
    restart: unless-stopped

volumes:
  signals-state:

networks:
  fpl-scout:
    external: true
