services:
  fpl-signals:
    build:
      context: .
      dockerfile: Dockerfile.signals
    image: fpl-signals
    container_name: fpl-signals
    ports:
      - "127.0.0.1:8090:8090"
    env_file: .env.signals
    environment:
      STATE_DIR: /state
    volumes:
      - signals-state:/state
    restart: unless-stopped

volumes:
  signals-state:
